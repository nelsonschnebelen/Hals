# Netlify deploy config for the Hal's site (Next.js static export).
# Connect this repo at app.netlify.com → "Add new site" → "Import from GitHub"
# and pick the `main` branch. Netlify reads this file automatically.

[build]
  # One repo, two site flavors — see scripts/netlify-build.sh.
  command = "bash scripts/netlify-build.sh"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  # Current default: promotion-only (the /win game at the site root; main
  # site hidden) in review mode (refresh to replay). For launch, delete
  # NEXT_PUBLIC_REPLAY; to bring the full site back, delete PROMO_ONLY.
  PROMO_ONLY = "1"
  NEXT_PUBLIC_REPLAY = "1"
